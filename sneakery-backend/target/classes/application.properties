# ==========================================
# Database Configuration
# ==========================================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=sneakery_db;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# Flyway Configuration
# ==========================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ==========================================
# JWT Configuration
# ==========================================
# JWT Secret: Base64 encoded 256-bit key for HS256 algorithm
# Generated using: openssl rand -base64 32
# IMPORTANT: Change this in production!
app.jwt.secret=7J2K8L9M0N1P2Q3R4S5T6U7V8W9X0Y1Z2A3B4C5D6E7F8G9H0I1J2K3L4M5N6O7P
app.jwt.expiration-ms=86400000

# ==========================================
# Server Configuration
# ==========================================
server.port=8080

# ==========================================
# CORS Configuration
# ==========================================
cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:5174
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
cors.allowed-headers=*

# ==========================================
# Cloudinary Configuration (Optional)
# ==========================================
cloudinary.cloud-name=YOUR_CLOUDINARY_CLOUD_NAME
cloudinary.api-key=YOUR_CLOUDINARY_API_KEY
cloudinary.api-secret=YOUR_CLOUDINARY_API_SECRET

# ==========================================
# Email Configuration (Optional)
# ==========================================
spring.mail.enabled=false
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=YOUR_EMAIL_ADDRESS
spring.mail.password=YOUR_EMAIL_PASSWORD

# ==========================================
# Payment Gateway Configuration
# ==========================================
# VNPay Configuration
# URL thanh toán VNPay (Sandbox)
payment.vnpay.url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html

# Mã website merchant (Terminal ID)
payment.vnpay.tmn-code=64ZEVQ2Y

# Secret key để tạo checksum
payment.vnpay.hash-secret=8BLHE18L0VG5IREOICPOXA6NULDCOXN1

# Return URL - Frontend sẽ hiển thị kết quả cho khách hàng
payment.vnpay.return-url=http://localhost:5173/payment/callback

# IPN URL - Server-to-server callback để cập nhật kết quả thanh toán
# QUAN TRỌNG: Cần gửi URL này cho VNPay sau khi thiết lập xong
payment.vnpay.ipn-url=http://localhost:8080/api/payment/vnpay/ipn

# MoMo Configuration (Optional)
payment.momo.url=https://test-payment.momo.vn/gw_payment/transactionProcessor
payment.momo.partner-code=YOUR_MOMO_PARTNER_CODE
payment.momo.access-key=YOUR_MOMO_ACCESS_KEY
payment.momo.secret-key=YOUR_MOMO_SECRET_KEY

# ==========================================
# Logging Configuration
# ==========================================
logging.level.com.sneakery=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ==========================================
# Spring Boot DevTools
# ==========================================
spring.devtools.restart.enabled=true

# ==========================================
# Cache Configuration (Caffeine)
# ==========================================
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=5m
spring.cache.cache-names=dashboardStats,productStats,brands,categories,products
